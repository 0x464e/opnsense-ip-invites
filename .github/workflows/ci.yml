name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, edited]
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
    outputs:
      source_sha:
        value: ${{ jobs.frontend.outputs.source_sha }}
        description: Commit whose frontend was tested and uploaded

permissions:
  contents: read

jobs:
  tooling:
    name: Conventions and release tooling
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-fund
      - name: Check Conventional Commits
        if: github.event_name != 'workflow_dispatch'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            printf '%s\n' "$PR_TITLE" | npm exec -- commitlint
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]; then
            npm exec -- commitlint --from "$BEFORE_SHA" --to HEAD
          else
            git log -1 --format=%B | npm exec -- commitlint
          fi
      - run: npm test

  backend:
    name: Go checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go test -race ./...
        env:
          CGO_ENABLED: "1"
      - run: make check-config

  frontend:
    name: Frontend and browser checks
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: npm ci --prefix web --no-fund
      - run: npm run lint --prefix web -- --deny-warnings
      - run: npm run build --prefix web
      - run: npm exec --prefix web -- playwright install --with-deps chromium
      - run: npm test --prefix web
      - name: Smoke test the production binary
        env:
          CGO_ENABLED: "0"
        run: |
          go build -tags production -o "$RUNNER_TEMP/opnsense-ip-invites" ./cmd/opnsense-ip-invites
          python3 scripts/smoke-test.py "$RUNNER_TEMP/opnsense-ip-invites"
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.source_ref != ''
        with:
          name: frontend-${{ steps.source.outputs.sha }}
          path: web/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failures
          path: web/test-results/
          retention-days: 7
