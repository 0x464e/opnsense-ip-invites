server:
  listen: "127.0.0.1:8080"
  public_url: "https://invites.example.com"
  # Optional: same app through an actually IPv4-only public HTTPS endpoint.
  ipv4_public_url: ""
  # Trust only your immediate reverse proxy and any legitimate XFF proxy hops.
  trusted_proxies: ["127.0.0.1/32"]
  client_ip_header: "X-Forwarded-For"

# Relative paths are resolved against this YAML file's directory.
database: "./data/invites.db"

# Required; the admin form is populated from these values. 0 means unlimited.
# Durations use Go syntax: 30m, 8h, 168h (not 7d).
defaults:
  link_validity: "168h"
  access_duration: "8h"
  max_ips: 0

opnsense:
  url: "https://firewall.example.com"
  ca_file: ""
  timeout: "10s"

sync_interval: "15s"

# Lists are created and managed in /admin.
