# Include within nginx's http {} context. Supply a working auth_request endpoint,
# TLS certificate configuration and an actual random proxy secret before use.
map $uri $ip_invites_loggable {
    ~^/(i/|api/public/invites/) 0;
    default 1;
}
upstream ip_invites_backend { server 127.0.0.1:8080; }

server {
    listen 443 ssl;
    server_name invites.example.com;
    # ssl_certificate ...;
    # ssl_certificate_key ...;
    access_log /var/log/nginx/ip-invites.log combined if=$ip_invites_loggable;

    location = /_invites_auth {
        internal;
        proxy_pass http://your-auth-service/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
    }
    location ~ ^/(admin(?:/|$)|api/admin(?:/|$)) {
        auth_request /_invites_auth;
        proxy_set_header X-Invites-Admin-Secret "REPLACE_WITH_THE_SAME_RANDOM_SECRET_AS_THE_APP";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_pass http://ip_invites_backend;
    }
    location / {
        proxy_set_header X-Invites-Admin-Secret "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_pass http://ip_invites_backend;
    }
}
